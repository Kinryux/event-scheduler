<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Group Events</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="index.html">Group Events</a>
        <nav class="site-nav">
          <a href="index.html">Events</a>
          <a href="admin.html" class="active" aria-current="page">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="admin-error" class="banner banner-error"></div>

      <section id="login-section">
        <h1>Admin login</h1>
        <p class="muted small caveat">
          Shared passphrase — anyone with it can create or delete events.
          Don't reuse a sensitive password.
        </p>
        <form id="login-form">
          <label>
            <span class="label-text">Passphrase</span>
            <input type="password" id="admin-pass" autocomplete="current-password" required />
          </label>
          <div class="form-actions">
            <button type="submit" class="primary">Unlock</button>
          </div>
        </form>
      </section>

      <section id="create-section" class="section hidden">
        <div class="section-head">
          <h2>Create event</h2>
          <button id="logout-button" class="ghost" type="button">Sign out</button>
        </div>
        <div id="create-status" class="banner"></div>
        <form id="create-form">
          <label>
            <span class="label-text">Title</span>
            <input type="text" id="create-title" required />
          </label>
          <label>
            <span class="label-text">Description</span>
            <textarea id="create-description" rows="3"></textarea>
          </label>
          <div class="grid-two">
            <label>
              <span class="label-text">Start date</span>
              <input type="date" id="create-start" required />
            </label>
            <label>
              <span class="label-text">End date</span>
              <input type="date" id="create-end" required />
            </label>
          </div>
          <div>
            <span class="label-text">Time slots</span>
            <div class="row slot-input-row">
              <input type="text" id="slot-input" placeholder="e.g. 9am–12pm" />
              <button type="button" id="add-slot">Add</button>
            </div>
            <div id="slot-chips" class="chips"></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">Create event</button>
          </div>
        </form>
      </section>

      <section id="manage-section" class="section hidden">
        <h2>Manage events</h2>
        <div id="manage-list" class="manage-list"></div>
        <div id="manage-empty" class="empty hidden">No events yet.</div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer-inner">
        <a href="index.html">Public site</a>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
