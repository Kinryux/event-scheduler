<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event — Group Events</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="index.html">Group Events</a>
        <nav class="site-nav">
          <a href="index.html">Events</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <p class="back-link"><a href="index.html">← All events</a></p>

      <div id="page-error" class="banner banner-error"></div>

      <section id="event-header" class="event-detail-header hidden">
        <div class="row" id="event-badges"></div>
        <h1 id="event-title"></h1>
        <p id="event-dates" class="muted"></p>
        <p id="event-description"></p>
      </section>

      <section class="section">
        <h2>Submitters</h2>
        <div id="submitters"></div>
        <div id="submitter-empty" class="empty hidden">No submissions yet.</div>
      </section>

      <section id="submit-section" class="section hidden">
        <h2>Submit your availability</h2>
        <p class="muted small">
          If you've already submitted, type your same name to load and update your picks.
        </p>
        <div id="submit-status" class="banner"></div>
        <form id="submit-form">
          <label>
            <span class="label-text">Your name</span>
            <input type="text" id="user-name" autocomplete="name" required />
          </label>
          <div class="scroll-x">
            <table id="availability-grid" class="availability-grid"></table>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">Submit availability</button>
          </div>
        </form>
      </section>

      <section id="closed-notice" class="section hidden">
        <div class="banner banner-warning" id="closed-message"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer-inner">
        <a href="index.html">All events</a>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/event.js"></script>
  </body>
</html>
