<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event — Event Availability</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1><a href="index.html">Event Availability</a></h1>
      </header>

      <main class="event-detail">
        <section id="event-header">
          <h2 id="event-title"></h2>
          <div id="event-badges" class="row"></div>
          <p id="event-dates" class="meta"></p>
          <p id="event-description"></p>
        </section>

        <section class="section">
          <h2>Submitters</h2>
          <ul id="submitter-list" class="submitters"></ul>
          <div id="submitter-empty" class="empty hidden">No submissions yet.</div>
        </section>

        <section id="submit-section" class="section">
          <h2>Submit your availability</h2>
          <div id="submit-error" class="error"></div>
          <form id="submit-form">
            <label>
              Your name
              <input type="text" id="user-name" required />
            </label>
            <div class="scroll-x">
              <table id="availability-grid" class="availability-grid"></table>
            </div>
            <div class="row">
              <button type="submit" class="primary">Submit availability</button>
            </div>
          </form>
        </section>

        <section id="locked-notice" class="section hidden">
          <div class="notice">Submissions are closed for this event.</div>
        </section>
      </main>

      <footer class="site-footer">
        <a href="index.html">All events</a> · <a href="admin.html">Admin</a>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/event.js"></script>
  </body>
</html>
