<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage — Event Scheduler</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="index.html">Event Scheduler</a>
        <nav class="site-nav">
          <a href="index.html">Events</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="page-error" class="banner banner-error"></div>

      <section id="manage-section" class="section">
        <h1>Manage events</h1>
        <p class="muted">View, edit, lock, or delete the events you've created.</p>
        <div id="manage-list" class="manage-list"></div>
        <div id="manage-empty" class="empty hidden">No events yet.</div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer-inner">
        <a href="index.html">Public site</a>
      </div>
    </footer>

    <div id="edit-modal-backdrop" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-label="Edit event">
        <button type="button" class="modal-close" id="edit-modal-close" aria-label="Close">×</button>
        <h2>Edit event</h2>
        <div id="edit-status" class="banner"></div>
        <form id="edit-form">
          <p class="subsection-label">Basics</p>
          <label>
            <span class="label-text">Title</span>
            <input type="text" id="edit-title" required />
          </label>
          <label>
            <span class="label-text">Description</span>
            <textarea id="edit-description" rows="3"></textarea>
          </label>
          <p class="subsection-label">Dates</p>
          <div class="calendar" id="edit-calendar">
            <div class="calendar-header">
              <button type="button" class="calendar-nav" id="edit-cal-prev" aria-label="Previous month">‹</button>
              <span class="calendar-title" id="edit-cal-title"></span>
              <button type="button" class="calendar-nav" id="edit-cal-next" aria-label="Next month">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="calendar-grid" id="edit-cal-grid"></div>
          </div>
          <div id="edit-date-chips" class="chips date-chips"></div>
          <p class="subsection-label">Time slots</p>
          <div class="row slot-input-row">
            <input type="text" id="edit-slot-input" placeholder="e.g. 9am–12pm" />
            <button type="button" id="edit-add-slot">Add</button>
          </div>
          <div id="edit-slot-chips" class="chips"></div>
          <p class="subsection-label">Polls</p>
          <div id="edit-polls-editor" class="polls-editor"></div>
          <div class="row">
            <button type="button" id="edit-add-poll" class="ghost">+ Add poll</button>
          </div>
          <div id="edit-removal-warning" class="banner banner-warning hidden"></div>
          <div class="form-actions">
            <button type="submit" class="primary">Save changes</button>
            <button type="button" class="ghost" id="edit-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/manage.js"></script>
  </body>
</html>
