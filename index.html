<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Events</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="index.html">Group Events</a>
        <nav class="site-nav">
          <a href="index.html" class="active" aria-current="page">Events</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="page-error" class="banner banner-error"></div>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="active" role="tab">Active</button>
        <button class="tab" data-tab="expired" role="tab">Expired</button>
      </div>

      <div id="event-list">
        <div id="active-events" class="event-list"></div>
        <div id="expired-events" class="event-list hidden"></div>

        <div id="empty-active" class="empty hidden">No active events.</div>
        <div id="empty-expired" class="empty hidden">No expired events.</div>

        <div id="loading" class="empty">Loading…</div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container site-footer-inner">
        <span class="muted">Group availability scheduling</span>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/public.js"></script>
  </body>
</html>
