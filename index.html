<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Availability</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1><a href="index.html">Event Availability</a></h1>
      </header>

      <main>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="active" role="tab">Active</button>
          <button class="tab" data-tab="expired" role="tab">Expired</button>
        </div>

        <section id="tab-active" class="tab-panel">
          <div id="active-list" class="event-list"></div>
          <div id="active-empty" class="empty hidden">No active events.</div>
        </section>

        <section id="tab-expired" class="tab-panel hidden">
          <div id="expired-list" class="event-list"></div>
          <div id="expired-empty" class="empty hidden">No expired events.</div>
        </section>
      </main>

      <footer class="site-footer">
        <a href="admin.html">Admin</a>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/public.js"></script>
  </body>
</html>
