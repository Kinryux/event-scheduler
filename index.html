<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Events</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1><a href="index.html">Group Events</a></h1>
      </header>

      <main>
        <div id="page-error" class="error"></div>

        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="active" role="tab">Active</button>
          <button class="tab" data-tab="expired" role="tab">Expired</button>
        </div>

        <div id="event-list">
          <div id="active-events" class="event-list"></div>
          <div id="expired-events" class="event-list hidden"></div>

          <div id="empty-active" class="empty hidden">No active events.</div>
          <div id="empty-expired" class="empty hidden">No expired events.</div>

          <div id="loading" class="empty">Loading…</div>
        </div>
      </main>

      <footer class="site-footer">
        <a href="admin.html">Admin</a>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/public.js"></script>
  </body>
</html>
